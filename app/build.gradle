plugins { id 'com.android.application' }

android {
    namespace 'com.hellobaroda.navratri'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hellobaroda.navratri'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '2.4'
    }

    signingConfigs {
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_PATH')
            def kp = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def ka = System.getenv('ANDROID_KEY_ALIAS')
            def kpass = System.getenv('ANDROID_KEY_PASSWORD')
            if (ks && kp && ka && kpass) {
                storeFile file(ks)
                storePassword kp
                keyAlias ka
                keyPassword kpass
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'
    implementation 'androidx.media3:media3-session:1.11.0'
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
