name: Build Asia Drama Online APK
on:
  workflow_dispatch:
  push:
    branches: [ app-online ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fix source issues before build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          java = Path('app/src/main/java/com/hellobaroda/navratri/MainActivity.java')
          s = java.read_text()
          s = s.replace('rowTitle("Popular Garba Grounds","See all",()->grounds())','rowTitle("Popular Garba Grounds","See all",v->grounds())')
          s = s.replace('rowTitle("Community moments","View trending",()->trending())','rowTitle("Community moments","View trending",v->trending())')
          java.write_text(s)
          
          bridge = Path('app/src/main/java/com/hellobaroda/navratri/MainActivity2.java')
          s = bridge.read_text()
          s = s.replace("const ep=window.catalog?.flatMap(x=>(x.seasons||[]).flatMap(s=>s.episodes||[])).find(e=>e.id===id);", "const ep=(typeof catalog!=='undefined'?catalog:[]).flatMap(x=>(x.seasons||[]).flatMap(s=>s.episodes||[])).find(e=>e.id===id);")
          bridge.write_text(s)
          
          html = Path('app/src/main/assets/index.html')
          s = html.read_text()
          s = s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script>')
          s = s.replace('let user=null,catalog=[],history=[];', 'let user=null,history=[];var catalog=[];let currentEpisodeId="",lastProgressSent=-1;')
          old = "async function playEpisode(id,title,url,paid){if(paid){if(!user)return openSheet('auth');toast('Payment verification is required before premium playback');return}if(!url){toast('This episode has no published video yet');return}document.getElementById('playerTitle').textContent=title;const v=document.getElementById('video');v.src=url;document.getElementById('player').classList.add('on');v.play().catch(()=>{});v.ontimeupdate=()=>{if(user&&Math.floor(v.currentTime)%10===0)saveProgress(id,Math.floor(v.currentTime),false)}}"
          new = "async function playEpisode(id,title,url,paid){if(paid){if(!user)return openSheet('auth');return startRazorpay(id,title)}if(!url){toast('This episode has no published video yet');return}currentEpisodeId=id;lastProgressSent=-1;document.getElementById('playerTitle').textContent=title;const v=document.getElementById('video');v.src=url;document.getElementById('player').classList.add('on');v.play().catch(()=>{});v.ontimeupdate=()=>{if(user){const p=Math.floor(v.currentTime);if(p>0&&p%10===0&&p!==lastProgressSent){lastProgressSent=p;saveProgress(id,p,false)}}};v.onended=()=>saveProgress(id,Math.floor(v.duration||v.currentTime),true)}"
          s = s.replace(old, new)
          s = s.replace("function closePlayer(){const v=document.getElementById('video');v.pause();v.removeAttribute('src');v.load();document.getElementById('player').classList.remove('on')}", "function closePlayer(){const v=document.getElementById('video');if(user&&currentEpisodeId&&v.currentTime>0)saveProgress(currentEpisodeId,Math.floor(v.currentTime),false);v.pause();v.removeAttribute('src');v.load();document.getElementById('player').classList.remove('on');currentEpisodeId='';lastProgressSent=-1}")
          s = s.replace("function shareApp(){if(navigator.share)navigator.share({title:'Asia Drama',text:'Stories worth staying for.'}).catch(()=>{});else toast('Share link copied soon')}", "async function shareApp(){const data={title:'Asia Drama',text:'Stories worth staying for.',url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);toast('Link copied')}catch(e){toast('Share link: '+location.href)}}}")
          s = s.replace("document.addEventListener('visibilitychange',()=>{if(document.hidden&&document.getElementById('video').currentTime)saveProgress('current',Math.floor(document.getElementById('video').currentTime),false)});", "document.addEventListener('visibilitychange',()=>{const v=document.getElementById('video');if(document.hidden&&user&&currentEpisodeId&&v.currentTime)saveProgress(currentEpisodeId,Math.floor(v.currentTime),false)});")
          marker = "async function playEpisode(id,title,url,paid){"
          if 'async function startRazorpay' not in s:
              fn = '''\nasync function startRazorpay(episodeId,title){\n  try{\n    const session=await sb.auth.getSession();\n    const token=session.data.session?.access_token;\n    if(!token)return openSheet('auth');\n    const r=await fetch(SUPA_URL+'/functions/v1/create-razorpay-order',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPA_KEY},body:JSON.stringify({episode_id:episodeId})});\n    const order=await r.json();\n    if(!r.ok)throw new Error(order.error||'Unable to create payment order');\n    if(!window.Razorpay)throw new Error('Payment checkout is unavailable');\n    const options={key:order.key_id,amount:order.amount,currency:order.currency,name:'Asia Drama',description:title||'Premium episode',order_id:order.order_id,theme:{color:'#ff2942'},handler:async function(response){\n      const vr=await fetch(SUPA_URL+'/functions/v1/verify-razorpay-payment',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPA_KEY},body:JSON.stringify({...response,episode_id:episodeId})});\n      const result=await vr.json();\n      if(!vr.ok||!result.verified)throw new Error(result.error||'Payment verification failed');\n      toast('Payment successful — episode unlocked');\n      const ep=(typeof catalog!=='undefined'?catalog:[]).flatMap(x=>(x.seasons||[]).flatMap(s=>s.episodes||[])).find(e=>e.id===episodeId);\n      if(ep?.video_url)playEpisode(episodeId,ep.title,ep.video_url,false);else toast('Payment verified. Video will be available when published.');\n    },modal:{ondismiss:function(){toast('Payment cancelled')}}};\n    new Razorpay(options).open();\n  }catch(e){toast(e.message||'Payment could not be started')}\n}\n\n'''
              s = s.replace(marker, fn+marker)

          interaction_fix = r'''<style id="asia-interaction-fix">body{padding-bottom:calc(82px + env(safe-area-inset-bottom));touch-action:manipulation}.nav{bottom:env(safe-area-inset-bottom);height:calc(76px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}.nav button,.icon,.round,.tab,.primary,.secondary,.danger,.link,.setting,.play{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}.nav .plus{flex:0 0 54px;width:54px;height:54px;min-width:54px;min-height:54px;margin:0 2px;position:relative;z-index:3;box-shadow:0 6px 20px rgba(255,41,66,.32)}main{padding-bottom:8px}.overlay{padding-bottom:env(safe-area-inset-bottom)}.sheet{padding-bottom:calc(25px + env(safe-area-inset-bottom))}</style><script>(function(){function show(html){var o=document.getElementById('overlay'),s=document.getElementById('sheet');if(!o||!s)return;s.innerHTML=html;o.classList.add('on')}function quick(){show('<button class="close" onclick="document.getElementById(\'overlay\').classList.remove(\'on\')">×</button><h2>Quick actions</h2><button class="setting" onclick="openSheet(\'search\')"><span>Search</span><b>⌕</b></button><button class="setting" onclick="go(\'series\',1);document.getElementById(\'overlay\').classList.remove(\'on\')"><span>Explore Series</span><b>›</b></button><button class="setting" onclick="go(\'community\',3);document.getElementById(\'overlay\').classList.remove(\'on\')"><span>Community</span><b>♡</b></button><button class="setting" onclick="go(\'profile\',4);document.getElementById(\'overlay\').classList.remove(\'on\')"><span>My Profile</span><b>●</b></button>')}function nav(view,idx){document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id===view)});var nb=document.querySelectorAll('.nav button');nb.forEach(function(b,i){b.classList.toggle('on',i===idx)});var tabs=document.querySelectorAll('.tab');tabs.forEach(function(b){b.classList.remove('on')});if(view==='series'||view==='movies')tabs[1]?.classList.add('on');else if(view==='shorts')tabs[3]?.classList.add('on');else if(view==='music')tabs[4]?.classList.add('on');else if(view==='home')tabs[0]?.classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}window.go=function(view,idx){nav(view,Number.isFinite(idx)?idx:0);if(view==='series'&&typeof loadCatalog==='function')loadCatalog();if(view==='profile'&&typeof updateProfile==='function')updateProfile();if(view==='admin'&&typeof loadAdmin==='function')loadAdmin()};document.addEventListener('DOMContentLoaded',function(){var plus=document.querySelector('.nav .plus');if(plus){plus.type='button';plus.setAttribute('aria-label','Quick actions');plus.onclick=function(e){e.preventDefault();e.stopPropagation();quick()}}document.querySelectorAll('.nav button,.actions button,.tab,.primary,.secondary,.danger,.setting,.play,.link,.round').forEach(function(b){b.type='button'})})})();</script>'''
          s = s.replace('</body>', interaction_fix+'</body>')
          html.write_text(s)
          
          import subprocess
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Persist source fixes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/hellobaroda/navratri/MainActivity.java app/src/main/java/com/hellobaroda/navratri/MainActivity2.java app/src/main/assets/index.html
            git commit -m "Fix Asia Drama mobile actions and safe-area layout [skip ci]"
            git push origin HEAD:app-online
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Asia-Drama-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
