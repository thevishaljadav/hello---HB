name: Build Asia Drama Online APK
on:
  workflow_dispatch:
  push:
    branches: [ app-online ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply Java compatibility fix
        run: |
          sed -i 's/rowTitle("Popular Garba Grounds","See all",()->grounds())/rowTitle("Popular Garba Grounds","See all",v->grounds())/' app/src/main/java/com/hellobaroda/navratri/MainActivity.java
          sed -i 's/rowTitle("Community moments","View trending",()->trending())/rowTitle("Community moments","View trending",v->trending())/' app/src/main/java/com/hellobaroda/navratri/MainActivity.java
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Asia-Drama-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
