name: Build Asia Drama Online APK
on:
  workflow_dispatch:
  push:
    branches: [ app-online ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fix Java callback syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/hellobaroda/navratri/MainActivity.java')
          s=p.read_text()
          s=s.replace('rowTitle("Popular Garba Grounds","See all",()->grounds())','rowTitle("Popular Garba Grounds","See all",v->grounds())')
          s=s.replace('rowTitle("Community moments","View trending",()->trending())','rowTitle("Community moments","View trending",v->trending())')
          p.write_text(s)
          PY
          git diff --check
      - name: Persist source fix
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/com/hellobaroda/navratri/MainActivity.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/hellobaroda/navratri/MainActivity.java
            git commit -m "Fix Android callback lambda syntax [skip ci]"
            git push origin HEAD:app-online
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Asia-Drama-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
