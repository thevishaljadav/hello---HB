name: Build Asia Drama Online APK
on:
  workflow_dispatch:
  push:
    branches: [ app-online ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Patch and validate source
        run: |
          python3 tools/patch_asia_drama.py
          python3 tools/patch_runtime_extras.py
          python3 tools/repair_html_runtime.py
          python3 tools/patch_visual_hardening.py
          python3 tools/normalize_cms_overlay.py
          python3 tools/patch_cms_overlay.py
          python3 tools/patch_admin_entry.py
          python3 tools/patch_interaction_auth.py
          python3 tools/patch_final_navigation.py
          python3 tools/patch_mobile_polish.py
          python3 tools/patch_live_sync.py
      - name: Persist source fixes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/hellobaroda/navratri/MainActivity.java app/src/main/java/com/hellobaroda/navratri/MainActivity2.java app/src/main/assets/index.html tools/repair_html_runtime.py tools/patch_visual_hardening.py tools/patch_cms_overlay.py tools/patch_admin_entry.py tools/normalize_cms_overlay.py tools/patch_interaction_auth.py tools/patch_final_navigation.py tools/patch_mobile_polish.py tools/patch_live_sync.py
            git commit -m "Update Asia Drama WebView and live catalogue sync [skip ci]"
            git push origin HEAD:app-online
          fi
      - name: Configure release signing when credentials are present
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/asia-drama-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/asia-drama-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing credentials detected."
          else
            echo "No release keystore configured; release artifacts will be unsigned test artifacts."
          fi
      - name: Run Android lint
        run: gradle :app:lintDebug
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease
      - name: Verify release artifacts
        shell: bash
        run: |
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          else
            echo "Unsigned release artifact: configure Android signing secrets before Play submission."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Asia-Drama-release-bundle
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Asia-Drama-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
