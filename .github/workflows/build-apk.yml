name: Build Hello Baroda Online APK
on:
  workflow_dispatch:
  push:
    branches: [ app-online ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Apply Java compatibility fix
        run: |
          sed -i 's/rowTitle("Popular Garba Grounds","See all",()->grounds())/rowTitle("Popular Garba Grounds","See all",v->grounds())/' app/src/main/java/com/hellobaroda/navratri/MainActivity.java
          sed -i 's/rowTitle("Community moments","View trending",()->trending())/rowTitle("Community moments","View trending",v->trending())/' app/src/main/java/com/hellobaroda/navratri/MainActivity.java
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hello-Baroda-online-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
